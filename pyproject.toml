[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "svo2view"
version = "0.1.0"
description = "Read and view Stereolabs ZED SVO2 recordings without the ZED SDK or an NVIDIA GPU (frames, timestamps, IMU / magnetometer / barometer, SDK-matching rectification)."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.10"
dependencies = ["av>=12", "opencv-python-headless>=4.8", "numpy>=1.24"]
keywords = ["zed", "svo", "svo2", "stereolabs", "stereo", "mcap", "imu", "viewer"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.optional-dependencies]
test = ["pytest>=7", "mcap>=1.1"]

[project.scripts]
svo2view = "svo2view.server:main"

[project.urls]
Homepage = "https://github.com/pulipakaa24/svo2view"

[tool.hatch.build.targets.wheel]
packages = ["src/svo2view"]
